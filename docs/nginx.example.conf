# Exemplo independente; revisar e instalar por procedimento operacional.
# Substitua o hostname e evite duplicar virtual hosts existentes.
# TLS deve ser configurado pelo operador neste proxy.
server {
    listen 80;
    server_name arcreports.example.org;

    # Margem para uploads de imagens de até 7 MB via multipart/form-data.
    client_max_body_size 10m;

    # Até 600s por consulta; ajustar segundo a política operacional.
    proxy_read_timeout 660s;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Este exemplo assume acesso direto do cliente a este proxy.
        # Sobrescreve o cabeçalho enviado pelo cliente usado no rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
